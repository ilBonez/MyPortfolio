  summary:
    it: >-
      Product Owner tecnico di una piattaforma di Generative AI in produzione per assicurazioni e banche.
      Seguo DoxaSuite dal 2023, prima come architetto e oggi come responsabile di backlog, roadmap e rilasci.
      Traduco requisiti di business e normativi in user story, ne decido le priorità con business, CTO e clienti
      e ne misuro il risultato su qualità dei dati e costo dell'AI.
    en: >-
      Technical Product Owner of a Generative AI platform running in production for insurers and banks.
      I have led DoxaSuite since 2023, first as its architect and now as owner of its backlog, roadmap and releases.
      I turn business and regulatory requirements into user stories, prioritise them with business, CTO and clients,
      and measure the outcome on data quality and AI cost.
